<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="賞と玉の数を設定して、ボタンで回すガラガラ抽選。残数管理・履歴・オフライン利用に対応。">
  <title>ガラガラポン | MRS TOOLS</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="brand">MRS TOOLS</p>
      <h1>ガラガラポン</h1>
    </header>
    <nav class="tabs" aria-label="画面切り替え">
      <button type="button" class="tab active" data-panel="draw-panel" aria-current="page">抽選</button>
      <button type="button" class="tab" data-panel="settings-panel">賞の設定</button>
      <button type="button" class="tab" data-panel="history-panel">履歴</button>
    </nav>
    <section id="draw-panel" class="tool-panel" aria-labelledby="draw-title">
      <div class="panel-heading"><h2 id="draw-title">今日の運だめし</h2><span class="remaining-badge">残り <strong id="total-remaining">0</strong> 玉</span></div>
      <div class="machine-stage" id="machine-stage" aria-hidden="true">
        <svg class="machine" viewBox="0 0 360 325" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="base-wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e6b873"/><stop offset="1" stop-color="#b5773c"/></linearGradient>
            <linearGradient id="front-wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7b875"/><stop offset="1" stop-color="#c58a43"/></linearGradient>
            <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#aaa8a0"/><stop offset=".5" stop-color="#ddd9ce"/><stop offset="1" stop-color="#858780"/></linearGradient>
          </defs>
          <ellipse cx="185" cy="296" rx="156" ry="16" fill="#000" opacity=".3"/>
          <!-- 台座と奥の支柱 -->
          <path d="M29 256L223 200L339 242L146 304Z" fill="url(#base-wood)" stroke="#80532d" stroke-width="3" stroke-linejoin="round"/>
          <path d="M29 256L146 304L146 317L29 269Z" fill="#b78040" stroke="#80532d" stroke-width="3"/>
          <path d="M146 304L339 242V255L146 317Z" fill="#9d672f" stroke="#80532d" stroke-width="3"/>
          <path d="M136 115L149 117L168 227L138 235L127 230Z" fill="#91958d" stroke="#595e59" stroke-width="3"/>
          <!-- 各面は軸のまわりで投影し直す。絵全体は平面回転させない -->
          <g id="drum-sides" stroke="#81512e" stroke-width="2.5" stroke-linejoin="round"></g>
          <polygon id="drum-front" fill="url(#front-wood)" stroke="#744727" stroke-width="4" stroke-linejoin="round"/>
          <polygon id="drum-rim" fill="none" stroke="#f2ce8e" stroke-width="5" stroke-linejoin="round"/>
          <g id="drum-grain" fill="none" stroke="#8e5a2b" stroke-width="1.3" opacity=".32"></g>
          <ellipse cx="232.8" cy="138.5" rx="25" ry="37" transform="rotate(10 232.8 138.5)" fill="#d4a361" stroke="#95602d" stroke-width="2.5"/>
          <g id="drum-outlet"><ellipse cx="104" cy="179" rx="10" ry="12" fill="#563a27" stroke="#bc995d" stroke-width="4"/><path d="M97 186L110 184L112 193L100 198Z" fill="#b8b8a8" stroke="#606660" stroke-width="2"/></g>
          <!-- 手前の支柱とハンドル -->
          <path d="M221 137L239 132L258 255L240 262L231 187L225 265L206 274Z" fill="url(#metal)" stroke="#63685f" stroke-width="3" stroke-linejoin="round"/>
          <path d="M221 137L221 163L211 272M239 132L245 255" fill="none" stroke="#ede7da" stroke-width="2" opacity=".55"/>
          <ellipse cx="232.8" cy="138.5" rx="10" ry="15" fill="#6f736a" stroke="#bcbcaf" stroke-width="3"/>
          <path id="crank-arm" d="M233 139L280 123L280 79L304 86" fill="none" stroke="#656b63" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="crank-highlight" d="M233 137L280 121L280 77L304 84" fill="none" stroke="#bdc2b5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <g id="crank-grip"><path d="M297 75L323 83Q332 86 332 94Q332 102 325 103L297 95Z" fill="#dc7c35" stroke="#814728" stroke-width="3"/><path d="M303 81L324 88" stroke="#ffb069" stroke-width="3" stroke-linecap="round"/></g>
          <!-- 受け皿。後ろの縁、玉、手前の縁の順に描画 -->
          <path d="M63 252L155 221L212 242L118 276Z" fill="#ebe5d5" stroke="#8d9187" stroke-width="3" stroke-linejoin="round"/>
          <path d="M63 252L67 241L155 211L212 231L212 242L155 221Z" fill="#caccc1" stroke="#8d9187" stroke-width="3" stroke-linejoin="round"/>
          <ellipse id="ball-shadow" cx="129" cy="251" rx="11" ry="4" fill="#000" opacity=".18" hidden/>
          <g id="drawn-ball" class="drawn-ball" hidden>
            <circle cx="129" cy="242" r="9" class="ball-fill" stroke="#6c6251" stroke-width="1"/>
            <circle cx="126" cy="239" r="2.5" fill="#fff" opacity=".6"/>
          </g>
          <path d="M63 252L118 276L212 242V253L118 287L67 264Z" fill="#afb4a7" stroke="#7e867b" stroke-width="3" stroke-linejoin="round"/>
          <path d="M118 276V287" stroke="#7e867b" stroke-width="3"/>
        </svg>
      </div>
      <div class="result-box" role="status" aria-live="polite" aria-atomic="true"><span class="result-eyebrow" id="result-label">準備できました</span><p id="result-text">何が出るかな？</p></div>
      <button id="spin-button" class="primary-button" type="button">まわす <span aria-hidden="true">↻</span></button>
      <p class="helper">出た玉は減っていきます。残りの玉から抽選します。</p>
      <ul id="prize-summary" class="prize-summary" aria-label="賞ごとの残りの玉"></ul>
      <button id="reset-button" class="secondary-button reset-button" type="button">玉を元に戻す</button>
    </section>
    <section id="settings-panel" class="tool-panel" aria-labelledby="settings-title" hidden>
      <h2 id="settings-title">賞と玉を決める</h2>
      <p class="panel-description">玉が多い賞ほど出やすくなります。各賞0〜9,999玉、最大20種類まで。</p>
      <form id="settings-form">
        <div id="prize-editor" class="prize-editor"></div>
        <button id="add-prize" type="button" class="secondary-button">＋ 賞を追加</button>
        <p class="settings-total">合計 <strong id="settings-total">0</strong> 玉</p>
        <p id="settings-error" class="error-message" role="alert"></p>
        <button type="submit" class="primary-button">設定を保存して抽選を始める</button>
        <p class="helper">設定を変更して保存すると、残数と履歴をリセットします。</p>
      </form>
    </section>
    <section id="history-panel" class="tool-panel" aria-labelledby="history-title" hidden>
      <div class="panel-heading"><h2 id="history-title">抽選履歴</h2><span class="remaining-badge"><strong id="draw-count">0</strong> 回</span></div>
      <p class="panel-description">新しい結果から表示します（最新200件）。</p>
      <p id="history-empty" class="empty-message">まだ抽選していません。</p>
      <ol id="history-list" class="history-list"></ol>
    </section>
    <p id="storage-message" class="error-message" role="alert" hidden></p>
    <p class="save-note">設定・残数・履歴は、この端末のブラウザに保存されます。</p>
    <footer class="site-footer"><a class="mrs-tools-link" href="https://mrs-tools.pages.dev/" target="_blank" rel="noopener noreferrer">MRS TOOLS</a></footer>
  </main>
  <script src="script.js?v=2"></script>
  <div class="ad-banner" aria-label="広告"><div class="ad-banner-inner"><!-- admax -->
    <script src="https://adm.shinobi.jp/s/8a495d941206bf0c34aff9559f8d2cea"></script>
    <!-- admax --></div></div>
</body>
</html>
