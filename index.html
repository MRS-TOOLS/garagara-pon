<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="賞と玉の数を設定して、ボタンで回すガラガラ抽選。残数管理・オフライン利用に対応。">
  <title>ガラガラポン | MRS TOOLS</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="brand">MRS TOOLS</p>
      <h1>ガラガラポン</h1>
    </header>
    <section id="draw-panel" class="tool-panel machine-card" aria-label="ガラガラ抽選">
      <button id="remaining-button" class="remaining-badge remaining-link" type="button" aria-haspopup="dialog" aria-controls="remaining-dialog">残り <strong id="total-remaining">0</strong> 玉</button>
      <div class="machine-stage" id="machine-stage" aria-hidden="true">
        <p class="machine-loading">3D表示を準備しています…</p>
      </div>
      <button id="settings-button" class="circle-button settings-button" type="button" aria-label="賞の設定を開く" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.04-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.15 7.15 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.23-1.13.54-1.63.94L5.17 5.3a.5.5 0 0 0-.6.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.14 7.14 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.4 1.04.71 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.23 1.13-.54 1.63-.94l2.39.96c.21.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
      </button>
      <button id="spin-button" class="circle-button spin-button" type="button" disabled aria-label="抽選をスタート"><span class="play-icon" aria-hidden="true"></span></button>
    </section>
    <section class="result-box" role="status" aria-live="polite" aria-atomic="true">
      <span class="result-eyebrow">RESULT</span><p id="result-text"></p>
    </section>
    <section id="history-section" class="history-section" aria-labelledby="history-title">
      <h2 id="history-title">抽選履歴</h2>
      <p id="history-empty" class="empty-message">まだ抽選していません。</p>
      <ol id="history-list" class="history-list"></ol>
    </section>
    <p id="storage-message" class="error-message" role="alert" hidden></p>
    <p class="save-note">設定・残数・履歴は、この端末のブラウザに保存されます。</p>
    <footer class="site-footer"><a class="mrs-tools-link" href="https://mrs-tools.pages.dev/" target="_blank" rel="noopener noreferrer">MRS TOOLS</a></footer>
  </main>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <div class="modal-handle" aria-hidden="true"></div>
    <h2 id="settings-title" tabindex="-1">賞と玉を決める</h2>
    <p class="panel-description">玉が多い賞ほど出やすくなります。各賞0〜9,999玉、最大20種類まで。</p>
    <form id="settings-form">
      <label class="display-toggle" for="show-remaining"><span>残玉数表示</span><input id="show-remaining" type="checkbox" role="switch" checked></label>
      <label class="display-toggle" for="show-history"><span>抽選履歴表示</span><input id="show-history" type="checkbox" role="switch" checked></label>
      <button id="reset-button" class="secondary-button reset-button" type="button">玉数リセット</button>
      <div id="prize-editor" class="prize-editor"></div>
      <button id="add-prize" type="button" class="secondary-button">＋ 賞を追加</button>
      <p class="settings-total">合計 <strong id="settings-total">0</strong> 玉</p>
      <p id="settings-error" class="error-message" role="alert"></p>
      <p class="helper">設定を変更して保存すると、残数をリセットします。</p>
      <div class="modal-actions"><button id="settings-cancel" type="button" class="secondary-button">キャンセル</button><button type="submit" class="primary-button">完了</button></div>
    </form>
  </dialog>
  <dialog id="remaining-dialog" class="remaining-dialog" aria-labelledby="remaining-title">
    <h2 id="remaining-title" tabindex="-1">色別の残玉数</h2>
    <ul id="remaining-list" class="remaining-list"></ul>
    <p class="remaining-total">合計 <strong id="remaining-total"></strong></p>
    <button id="remaining-close" class="secondary-button" type="button">閉じる</button>
  </dialog>
  <script src="script.js?v=7"></script>
  <div class="ad-banner" aria-label="広告"><div class="ad-banner-inner"><!-- admax -->
    <script src="https://adm.shinobi.jp/s/8a495d941206bf0c34aff9559f8d2cea"></script>
    <!-- admax --></div></div>
</body>
</html>
